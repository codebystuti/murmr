<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D1A"/>
      <stop offset="100%" stop-color="#08070D"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#08070D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" rx="0" fill="none" stroke="#2A2638" stroke-width="2"/>

  <!-- Waveform — original 36×28 viewBox paths, scaled ×7 and centered -->
  <!-- Scale 7: width=252, height=196. Center at x=600, y=245 → offset x=474, y=147 -->
  <g transform="translate(474, 147) scale(7)">
    <path d="M2 14 Q 9 4, 16 14 T 30 14" stroke="url(#brand)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M2 20 Q 11 12, 18 20 T 32 20" stroke="url(#brand)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M4 26 Q 12 20, 20 26 T 34 26" stroke="url(#brand)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.45"/>
  </g>

  <!-- Wordmark -->
  <text
    x="600" y="410"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="80"
    font-weight="700"
    letter-spacing="-2"
    fill="#F4F2FA"
  >murmr</text>

  <!-- Tagline -->
  <text
    x="600" y="470"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="26"
    font-weight="400"
    fill="#A8A2BD"
  >Listen to the murmur. Ship what matters.</text>
</svg>
