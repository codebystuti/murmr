<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Murmr — Listen to the murmur. Ship what matters.</title>
    <meta name="description" content="A focused public inbox for product feedback. Collect, prioritize, and ship — all in one place. Free forever, no credit card required." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://codebystuti.github.io/murmr/" />
    <meta property="og:title" content="Murmr — Listen to the murmur. Ship what matters." />
    <meta property="og:description" content="A focused public inbox for product feedback. Collect, prioritize, and ship — all in one place." />
    <meta property="og:image" content="https://codebystuti.github.io/murmr/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Murmr — Listen to the murmur. Ship what matters." />
    <meta name="twitter:description" content="A focused public inbox for product feedback. Collect, prioritize, and ship — all in one place." />
    <meta name="twitter:image" content="https://codebystuti.github.io/murmr/og-image.png" />

    <link rel="canonical" href="https://codebystuti.github.io/murmr/" />
    <!-- Synchronously restore stored theme before first paint to prevent flash -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('murmr-theme');
          if (raw) {
            var stored = JSON.parse(raw);
            var theme = stored && stored.state && stored.state.theme;
            if (theme === 'light' || theme === 'dark') {
              document.documentElement.setAttribute('data-theme', theme);
            }
          }
        } catch (_) {}
      })();
    </script>
    <!-- spa-github-pages: decode redirect back into real history path -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded.slice(1).length ? '?' + decoded.slice(1).join('&') : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: media=print prevents render-blocking; onload flips to all -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
