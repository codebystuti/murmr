<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Murmr</title>
    <script>
      // spa-github-pages redirect (rafgraph/spa-github-pages)
      // pathSegmentsToKeep = 1 preserves the /murmr/ base path segment.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
